name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please remove any secrets, tokens or private data before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: "The command you ran, the output shush returned, and (if possible) the raw output it was compressing. Remove anything private first."
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS and runtime version
